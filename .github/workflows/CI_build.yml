name: CI_build

on: [push, pull_request]

jobs:
  build:

    runs-on: windows-latest
    env:
      Projectname: CalcStudioEPM
    strategy:
      fail-fast: false
      matrix:
        build_platform: [x64]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: MSBuild for nuget package restore
      working-directory: .\CalcStudioEPM
      run: |
           msbuild ${{ env.Projectname }}.csproj -t:restore -p:RestorePackagesConfig=true

    - name: MSBuild of plugin dll Debug
      working-directory: .\CalcStudioEPM
      run: |
           msbuild ${{ env.Projectname }}.csproj  /p:configuration=Debug /p:platform="${{ matrix.build_platform }}"

    - name: MSBuild of plugin dll Release
      working-directory: .\CalcStudioEPM
      run: |
           msbuild ${{ env.Projectname }}.csproj  /p:configuration=Release /p:platform="${{ matrix.build_platform }}"

    - uses: jixxed/get-tag@3.0.1
      id: tagName

    - name: zip artifacts for Release ${{ matrix.build_platform }}
      run: |
           7z a ${{ env.Projectname }}_${{ steps.tagName.outputs.tag }}_${{ matrix.build_platform }}.zip .\CalcStudioEPM\bin\${{ matrix.build_platform }}\Release\net48\${{ env.Projectname }}.dll

    - name: Archive artifacts for Release ${{ matrix.build_platform }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.Projectname }}_${{ steps.tagName.outputs.tag }}_${{ matrix.build_platform }}.zip
        path: ${{ env.Projectname }}_${{ steps.tagName.outputs.tag }}_${{ matrix.build_platform }}.zip

    - name: Create release on tagging
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ${{ env.Projectname }}_${{ steps.tagName.outputs.tag }}_${{ matrix.build_platform }}.zip