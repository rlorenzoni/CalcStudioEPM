# Builds the plugin and runs the tests on every push to main and every pull request.
# The build number is kept as committed (KeepBuildNumber), so CI never changes BuildNumber.txt.
# The Corpus tests need private pulls (CALCSTUDIO_TEST_DATA / _IPM) and run locally only.
name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and test
        shell: cmd
        run: test.bat /TestCaseFilter:"TestCategory!=Corpus"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/

      # The release zip's four files, side by side at the top of the artifact
      - name: Collect the plugin files
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item CalcStudioEPM/bin/x64/Release/net48/CalcStudioEPM.dll, CalcStudioEPM/bin/x64/Release/net48/Newtonsoft.Json.dll,
                    LICENSE, THIRD-PARTY-NOTICES.md dist/

      - name: Upload the plugin
        uses: actions/upload-artifact@v7
        with:
          name: CalcStudioEPM-${{ github.sha }}
          path: dist/
